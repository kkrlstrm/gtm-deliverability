[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gtm-deliverability"
version = "0.1.0"
description = "Recipient-side campaign control for cold email: classify MX gateways, isolate cohorts, and throttle account exposure before launch."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Kai Karlstrom" }]
keywords = ["cold-email", "deliverability", "email-gateway", "proofpoint", "mimecast", "barracuda", "mx", "gtm", "outbound"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email",
]
dependencies = ["dnspython>=2.3"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/kkrlstrm/gtm-deliverability"
Repository = "https://github.com/kkrlstrm/gtm-deliverability"

[project.scripts]
mailgate = "mailgate.cli:main"

[tool.setuptools]
packages = ["mailgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
